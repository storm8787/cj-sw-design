# Render Blueprint — 테스트 배포용(docs/DEPLOY.md). 웹 서비스 1개 + 영속 디스크(/data).
# 비밀값(관리자 비밀번호·AI 키)은 이 파일에 쓰지 않는다: sync: false 항목은 Render 화면에서 직접 입력한다.
services:
  - type: web
    name: sw-design-helper
    runtime: docker
    plan: starter # 디스크는 유료 인스턴스에서만 붙는다(무료는 재시작 때 데이터 삭제)
    region: singapore # 한국과 가장 가까운 Render 지역
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    numInstances: 1 # SQLite·작업 스레드 구조라 1대만(디스크가 붙으면 확장 불가)
    disk:
      name: swdata
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: COOKIE_SECURE
        value: "true"
      # 로그인 실패 제한(5회/5분)을 '접속자별'로 세기 위해 신뢰할 프록시 단 수(앱 기본값은 0 = 헤더 불신).
      # X-Forwarded-For를 오른쪽에서 센다(왼쪽은 클라이언트가 위조할 수 있어 신뢰하지 않음).
      # 2 = 2026-11-06 실제 배포에서 측정한 값. /api/system의 client가 forwarded_count 2,
      #     오른쪽 1번째는 Cloudflare 대역(172.64.0.0/13) 주소였다 → 체인은 [실제 접속자, Cloudflare 엣지].
      #     1로 두면 Cloudflare 엣지 주소로 묶여 같은 엣지를 쓰는 접속자들이 함께 잠긴다.
      # 인프라가 바뀌면 값도 바뀔 수 있다. 배포 후 한 번 확인한다(docs/DEPLOY.md §4-1):
      #   login_throttle_key가 본인 공인 IP이고 shared_key_warning이 비어 있으면 정상.
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      - key: SECRET_KEY
        generateValue: true # Render가 무작위 값 생성
      - key: ADMIN_PASSWORD # 10자 이상. 해시를 쓰려면 이 항목 대신 ADMIN_PASSWORD_HASH
        sync: false
      - key: OPENAI_API_KEY # 비우면 샘플 모드(AI 아님)
        sync: false
      # 2026-10-30 소규모 비교시험(docs/AI_COST.md)을 통과한 구성: 기본 gpt-6-luna, FP 후보만 gpt-6.1-sol
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_MODEL_FP_CANDIDATES
        value: gpt-6.1-sol

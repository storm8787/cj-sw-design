name: Pages 시연판

# GitHub Pages 정적 시연판(docs/DEMO.md). 실제 앱(서버)은 배포하지 않는다.
# - main 푸시·수동 실행: 샘플 생성·검증 → 시연 빌드 → 브라우저 확인 → Pages 배포
# - PR: 같은 빌드·확인만 하고 배포하지 않는다(공개 사이트를 덮어쓰지 않음)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages가 Pages 설정을 읽음(main에서만 실행)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: 샘플 데이터 생성·검증(Python은 빌드 단계에서만 실행, Pages에서는 실행하지 않음)
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python -m tools.demo_data
          uv run python -m tools.demo_data --check
      - name: 시연판 빌드(base /cj-sw-design/)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build:demo
      - name: 배포 파일 확인(정적 시연 파일만)
        working-directory: frontend/dist-demo
        run: |
          find . -type f | sort
          # 예제 파일(examples/ 원본 복사본)만 .md·.txt를 허용한다
          bad=$(find . -type f ! \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.xlsx' -o -name '*.docx' \) ! \( -path './demo-data/examples/*' \( -name '*.md' -o -name '*.txt' \) \))
          if [ -n "$bad" ]; then echo "예상 밖 파일: $bad"; exit 1; fi
          if grep -rIl -e 'OPENAI_API_KEY' -e 'ADMIN_PASSWORD' -e 'demo-generator-' .; then echo "비밀값 이름·생성기 값이 들어 있음"; exit 1; fi
      - name: Playwright 설치
        working-directory: e2e
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: 시연판 브라우저 확인(정적 서버만, 백엔드 없음 — /api·외부 요청 0건)
        run: node e2e/demo.cjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-e2e-output
          path: e2e/output
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist-demo

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # Pages 배포
      id-token: write # 배포 출처 확인(OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

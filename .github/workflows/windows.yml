name: Windows 시험판

# Windows runner에서 PyInstaller one-folder 시험판을 만들고, 내려받은 것과 같은 ZIP을 새로 풀어 그 실행파일을 실행해 검증한다.
# 실제 API 키·운영 비밀번호를 쓰지 않는다(임시 시험 비밀번호·가짜 키만, 산출물에 남지 않음). 공개 Release는 만들지 않는다.
on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "examples/**"
      - "e2e/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      UV_PYTHON: "3.13.17" # 묶을 Python 런타임(대상 PC의 Python과 무관)
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 화면 일반 빌드(Pages 시연 빌드 아님)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: "빌드 의존성(고정 버전 — uv.lock, PyInstaller 6.22.3)"
        working-directory: backend
        run: uv sync --frozen --group desktop
      - name: 런처 단위 테스트
        working-directory: backend
        run: uv run --frozen pytest -q tests/test_desktop.py tests/test_security.py
      - name: PyInstaller 빌드·금지 파일 검사·ZIP·SHA-256
        working-directory: backend
        run: uv run --frozen --group desktop python -m desktop.build
      - name: 브라우저 E2E 준비(검사 도구용, 패키지에는 포함 안 됨)
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium
      - name: 패키지 실행 검증(ZIP을 한글·공백 경로에 풀어 실행파일 실행, 최소 PATH)
        working-directory: backend
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist\CJ-SW-Design-windows-x64-*.zip | Select-Object -First 1).FullName
          uv run --frozen python -m desktop.smoke --zip "$zip" --work "$env:RUNNER_TEMP\smoke" --e2e --report dist\smoke-report.json
      - name: 시험용 ZIP·해시·빌드 정보·검증 결과 보관(14일)
        uses: actions/upload-artifact@v4
        with:
          name: CJ-SW-Design-windows-x64-trial-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            backend/dist/*.zip
            backend/dist/*.sha256
            backend/dist/build_info.json
            backend/dist/smoke-report.json
      - name: 실패 시 진단 기록
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-trial-logs-${{ github.sha }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/smoke/**/logs/*.log
            backend/build/pyinstaller/cj-sw-design/warn-cj-sw-design.txt
            e2e/output/

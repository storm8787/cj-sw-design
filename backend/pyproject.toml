[project]
name = "sw-design-helper"
version = "0.1.0"
description = "정보화 설계 도우미 — 서버"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "olefile>=0.47",
    "httpx>=0.27",
    "anthropic>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
